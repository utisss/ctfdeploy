[workspace]
name = "ctfdeploy"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
python = "3.13.*"
httpx = ">=0.28"
jinja2 = ">=3.1"
pyyaml = ">=6.0"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"

[tasks]
ctfdeploy = "python -m ctfdeploy"

[feature.dev.dependencies]
pytest = ">=8"
ruff = ">=0.14"
uv = ">=0.9"

[feature.dev.tasks]
test = { cmd = "pytest -q", default-environment = "dev" }
lint = { cmd = "ruff check . && ruff format --check .", default-environment = "dev" }
fmt = { cmd = "ruff check --fix . && ruff format .", default-environment = "dev" }

[environments]
dev = { features = ["dev"], solve-group = "default" }
